<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal RAG Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans">
    <header class="border-b border-gray-800 bg-gray-900/50 backdrop-blur px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">ONYX MULTIMODAL RAG</h1>
        <button onclick="resetEngineSession()" class="text-xs font-semibold uppercase tracking-widest border border-red-500/30 text-red-400 px-4 py-2 rounded-lg bg-red-500/10 hover:bg-red-500/20">Reset Session</button>
    </header>
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <section class="lg:col-span-4 flex flex-col gap-6">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col gap-4">
                <div id="dropZone" class="border-2 border-dashed border-gray-700 hover:border-emerald-500 rounded-xl p-8 text-center cursor-pointer bg-gray-950/50 flex flex-col items-center justify-center gap-2">
                    <p class="text-sm text-gray-300">Drag & drop files or click to upload</p>
                    <input type="file" id="fileSelector" class="hidden">
                </div>
                <div id="uploadTelemetry" class="text-xs text-emerald-400 hidden bg-emerald-950/30 border p-3 rounded-lg font-mono"></div>
            </div>
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 flex flex-col gap-4">
                <label class="flex items-center justify-between p-3 rounded-xl bg-gray-950/50 border cursor-pointer">
                    <span class="text-sm">Tavily Hybrid Live Search</span>
                    <input type="checkbox" id="webSearchToggle" checked class="w-4 h-4 accent-emerald-500">
                </label>
            </div>
        </section>
        <section class="lg:col-span-8 flex flex-col bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden min-h-[500px]">
            <div id="chatDisplayTerminal" class="flex-1 p-6 overflow-y-auto flex flex-col gap-4"></div>
            <div class="p-4 bg-gray-950/80 border-t border-gray-800 flex items-center gap-3">
                <input type="text" id="userInputQuery" placeholder="Ask a question or request a file export (PDF/DOCX)..." class="flex-1 bg-gray-900 text-sm border rounded-xl px-4 py-3.5 focus:outline-none focus:border-emerald-500">
                <button onclick="executeInferenceTransaction()" class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 text-sm font-bold px-6 py-3.5 rounded-xl">Query</button>
            </div>
        </section>
    </main>
    <script>
        const dropZone = document.getElementById('dropZone');
        const fileSelector = document.getElementById('fileSelector');
        const uploadTelemetry = document.getElementById('uploadTelemetry');
        const chatDisplayTerminal = document.getElementById('chatDisplayTerminal');

        dropZone.addEventListener('click', () => fileSelector.click());
        fileSelector.addEventListener('change', (e) => handleAssetUploadTransaction(e.target.files[0]));
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
        dropZone.addEventListener('drop', (e) => { e.preventDefault(); if(e.dataTransfer.files.length > 0) handleAssetUploadTransaction(e.dataTransfer.files[0]); });

        async function handleAssetUploadTransaction(file) {
            if(!file) return;
            uploadTelemetry.classList.remove('hidden');
            uploadTelemetry.innerText = `Uploading "${file.name}"...`;
            const payload = new FormData(); payload.append('file', file);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: payload });
                const data = await res.json();
                uploadTelemetry.innerText = data.message || 'Success';
            } catch(e) { uploadTelemetry.innerText = 'Upload failed.'; }
        }

        async function executeInferenceTransaction() {
            const queryField = document.getElementById('userInputQuery');
            const prompt = queryField.value.trim(); if(!prompt) return;
            appendMessageElement('user', prompt); queryField.value = '';
            const loading = appendMessageElement('assistant', 'Processing pipeline...');
            try {
                const toggle = document.getElementById('webSearchToggle').checked;
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt, enable_web_search: toggle })
                });
                const data = await res.json(); loading.remove();
                let text = data.response.replace(/\n/g, '<br>');
                if(data.download_url) {
                    text += `<div class="mt-4 p-4 rounded-xl bg-cyan-950 border border-cyan-800 flex justify-between items-center">
                        <span class="text-xs text-cyan-400">File Output Ready</span>
                        <a href="${data.download_url}" download class="bg-cyan-500 text-gray-950 font-bold text-xs px-4 py-2 rounded-lg">Download ${data.file_type}</a>
                    </div>`;
                }
                appendMessageElement('assistant', text);
            } catch(e) { loading.remove(); appendMessageElement('assistant', 'Error executing pipeline query.'); }
        }

        function appendMessageElement(sender, content) {
            const div = document.createElement('div');
            div.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';
            const inner = document.createElement('div');
            inner.className = sender === 'user' ? 'bg-gray-800 p-4 rounded-xl text-sm text-gray-100' : 'bg-gray-950 p-4 border border-gray-800 rounded-xl text-sm text-gray-200';
            inner.innerHTML = content; div.appendChild(inner); chatDisplayTerminal.appendChild(div);
            chatDisplayTerminal.scrollTop = chatDisplayTerminal.scrollHeight; return div;
        }

        async function resetEngineSession() { await fetch('/api/reset', { method: 'POST' }); chatDisplayTerminal.innerHTML = ''; }
    </script>
</body>
</html>
